<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora - Person Wise Ledger</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        .ghost-wrapper {
            position: relative;
            width: 100%;
        }
        .ghost-input {
            position: relative;
            z-index: 2;
            background: transparent !important;
        }
        .ghost-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            padding-left: 0.75rem;
            padding-right: 0.75rem;
            font-size: 0.875rem;
            line-height: 1.25rem;
            color: #9ca3af;
            pointer-events: none;
            z-index: 1;
            white-space: pre;
            overflow: hidden;
            font-family: inherit;
        }
        /* Ledger Background Patterns */
        .ledger-bg-light {
            background-color: #f8fafc;
            background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                              linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .ledger-bg-dark {
            background-color: #020617;
            background-image: linear-gradient(to right, #1e293b 1px, transparent 1px),
                              linear-gradient(to bottom, #1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }
        /* RGB Glow Animation for General Buttons */
        @keyframes rgb-glow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        .rgb-btn {
            background: linear-gradient(60deg, #ef4444, #22c55e, #3b82f6, #a855f7, #ef4444);
            background-size: 300% 300%;
            animation: rgb-glow 5s linear infinite;
        }
    </style>
</head>
<body id="appBody" class="ledger-bg-light text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between font-sans transition-colors duration-300">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white shadow-md border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <!-- Logo with Home Navigation Click -->
            <div onclick="resetToHome()" class="flex items-center gap-3 cursor-pointer group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight group-hover:text-indigo-400 transition">NEXORA LEDGER</h1>
                    <p class="text-xs text-slate-400">Person-wise Smart Ledger System</p>
                </div>
            </div>

            <!-- Action Buttons: Export, Import & RGB Theme Toggle -->
            <div class="flex items-center gap-2 flex-wrap justify-center">
                <button onclick="exportData()" class="rgb-btn text-white text-sm font-medium px-3.5 py-2 rounded-lg transition shadow-sm active:scale-95 flex items-center gap-2">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export
                </button>
                <label class="rgb-btn text-white text-sm font-medium px-3.5 py-2 rounded-lg transition shadow-sm cursor-pointer active:scale-95 flex items-center gap-2">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Import
                    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
                </label>
                <!-- RGB Animated Theme Toggle Button -->
                <button onclick="toggleTheme()" class="rgb-btn text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-md transition transform active:scale-95 flex items-center gap-2">
                    <svg id="themeIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <span id="themeText">Theme</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Column: Entry Form & Persons List -->
        <div class="lg:col-span-1 space-y-6">
            
            <!-- Entry Form Card -->
            <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 transition-colors">
                <h2 class="text-lg font-semibold text-slate-900 dark:text-slate-100 mb-4 flex items-center justify-between">
                    <span>New Entry</span>
                    <span id="formModeBadge" class="text-xs font-normal px-2.5 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-full">Adding</span>
                </h2>

                <form id="ledgerForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <!-- Person Name with Ghost Suggestion -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Person Name</label>
                        <div class="ghost-wrapper bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl focus-within:ring-2 focus-within:ring-indigo-500 focus-within:bg-white dark:focus-within:bg-slate-800 transition">
                            <div id="ghostSuggestion" class="ghost-overlay"></div>
                            <input type="text" id="personInput" autocomplete="off" required
                                class="ghost-input w-full px-3 py-2.5 text-slate-900 dark:text-slate-100 text-sm focus:outline-none border-none rounded-xl"
                                placeholder="Type name..." oninput="handlePersonInput(event)" onkeydown="handlePersonKeyDown(event)">
                        </div>
                        <div id="changePersonContainer" class="hidden mt-2 flex items-center justify-between bg-indigo-50 dark:bg-indigo-950/50 p-2 rounded-lg border border-indigo-100 dark:border-indigo-900">
                            <span id="selectedPersonDisplay" class="text-xs font-medium text-indigo-900 dark:text-indigo-200 truncate"></span>
                            <button type="button" onclick="unlockPerson()" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 bg-white dark:bg-slate-800 px-2 py-1 rounded shadow-sm border border-indigo-200 dark:border-indigo-800">Change</button>
                        </div>
                    </div>

                    <!-- Date Field -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Date</label>
                        <input type="date" id="dateInput" 
                            class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2.5 text-slate-900 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    </div>

                    <!-- Type (Given / Taken with Green & Red active states) -->
                    <div class="grid grid-cols-2 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="entryType" value="given" checked class="peer sr-only">
                            <div class="text-center py-2.5 text-sm font-semibold border border-slate-300 dark:border-slate-700 rounded-xl text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-600 transition shadow-sm">
                                Given (Debit)
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="entryType" value="taken" class="peer sr-only">
                            <div class="text-center py-2.5 text-sm font-semibold border border-slate-300 dark:border-slate-700 rounded-xl text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-800 peer-checked:bg-rose-600 peer-checked:text-white peer-checked:border-rose-600 transition shadow-sm">
                                Taken (Credit)
                            </div>
                        </label>
                    </div>

                    <!-- Amount Field -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Amount (₹)</label>
                        <input type="number" id="amountInput" step="0.01" min="0.01" required placeholder="0.00"
                            class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2.5 text-slate-900 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                    </div>

                    <!-- Submit Buttons with RGB Style -->
                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="submitBtn" class="w-full rgb-btn text-white font-semibold py-3 rounded-xl transition shadow-md text-sm">
                            Save Entry
                        </button>
                        <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold px-4 py-3 rounded-xl transition text-sm">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>

            <!-- Persons A-Z List Card -->
            <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 transition-colors">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-3">Persons Directory (A–Z)</h3>
                <div id="personsListContainer" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <!-- Dynamic Persons List -->
                </div>
            </div>

        </div>

        <!-- Right Column: Ledger View & Transactions Table -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Summary Stats Card -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm transition-colors">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Given</p>
                    <p id="totalGiven" class="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">₹0.00</p>
                </div>
                <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm transition-colors">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Taken</p>
                    <p id="totalTaken" class="text-2xl font-bold text-rose-600 dark:text-rose-400 mt-1">₹0.00</p>
                </div>
                <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm transition-colors">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Net Balance</p>
                    <p id="netBalance" class="text-2xl font-bold text-slate-900 dark:text-slate-100 mt-1">₹0.00</p>
                </div>
            </div>

            <!-- Transactions Table Card -->
            <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col transition-colors">
                <div class="p-5 border-b border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h2 id="activeLedgerTitle" class="text-lg font-bold text-slate-900 dark:text-slate-100">All Transactions</h2>
                        <p id="activeLedgerSubtitle" class="text-xs text-slate-500 dark:text-slate-400">Showing complete transaction history</p>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <input type="text" id="searchInput" oninput="renderApp()" placeholder="Search transactions..." 
                            class="w-full sm:w-48 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="resetToHome()" id="showAllBtn" class="hidden text-xs rgb-btn text-white px-3 py-1.5 rounded-lg font-medium transition">
                            Show All
                        </button>
                    </div>
                </div>

                <!-- Table Container -->
                <div class="overflow-x-auto flex-grow">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50/70 dark:bg-slate-800/70 border-b border-slate-100 dark:border-slate-800 text-[11px] font-bold uppercase tracking-wider text-slate-400">
                                <th class="py-3 px-4">Date</th>
                                <th class="py-3 px-4">Person</th>
                                <th class="py-3 px-4">Type</th>
                                <th class="py-3 px-4 text-right">Amount</th>
                                <th class="py-3 px-4 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsTableBody" class="divide-y divide-slate-100 dark:divide-slate-800 text-sm">
                            <!-- Rows -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 dark:border-slate-800 mt-auto transition-colors">
        Nexora Ledger &copy; 2026 &bull; Secure Local Storage Ledger
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const defaultInitialData = [
            
        ];

        let ledgerData = JSON.parse(localStorage.getItem('nexora_ledger_entries'));
        if (!ledgerData || ledgerData.length === 0) {
            ledgerData = defaultInitialData;
            localStorage.setItem('nexora_ledger_entries', JSON.stringify(ledgerData));
        }

        let lockedPerson = null; 
        let editingId = null;
        let currentFilterPerson = null;

        window.onload = function() {
            initTheme();
            setDefaultDate();
            renderApp();
        };

        function initTheme() {
            const savedTheme = localStorage.getItem('nexora_theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('appBody').className = "ledger-bg-dark text-slate-100 min-h-screen flex flex-col justify-between font-sans transition-colors duration-300";
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('appBody').className = "ledger-bg-light text-slate-800 min-h-screen flex flex-col justify-between font-sans transition-colors duration-300";
            }
        }

        function toggleTheme() {
            const htmlEl = document.documentElement;
            const isDark = htmlEl.classList.toggle('dark');
            const bodyEl = document.getElementById('appBody');
            
            if (isDark) {
                localStorage.setItem('nexora_theme', 'dark');
                bodyEl.className = "ledger-bg-dark text-slate-100 min-h-screen flex flex-col justify-between font-sans transition-colors duration-300";
            } else {
                localStorage.setItem('nexora_theme', 'light');
                bodyEl.className = "ledger-bg-light text-slate-800 min-h-screen flex flex-col justify-between font-sans transition-colors duration-300";
            }
        }

        function setDefaultDate() {
            const dateInput = document.getElementById('dateInput');
            if (!dateInput.value) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.value = today;
            }
        }

        function getUniquePersons() {
            const persons = [...new Set(ledgerData.map(item => item.person.trim()))];
            return persons.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'accent' }));
        }

        function handlePersonInput(e) {
            const val = e.target.value;
            const ghostEl = document.getElementById('ghostSuggestion');
            
            if (!val) {
                ghostEl.textContent = '';
                return;
            }

            const persons = getUniquePersons();
            const match = persons.find(p => p.toLowerCase().startsWith(val.toLowerCase()));

            if (match && match.toLowerCase() !== val.toLowerCase()) {
                ghostEl.textContent = val + match.slice(val.length);
            } else {
                ghostEl.textContent = '';
            }
        }

        function handlePersonKeyDown(e) {
            const ghostEl = document.getElementById('ghostSuggestion');
            const input = e.target;

            if (['Tab', 'ArrowRight', 'ArrowDown', 'Enter'].includes(e.key)) {
                if (ghostEl.textContent) {
                    e.preventDefault();
                    input.value = ghostEl.textContent;
                    ghostEl.textContent = '';
                }
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            let personName = lockedPerson || document.getElementById('personInput').value.trim();
            if (!personName) return;
            personName = personName.charAt(0).toUpperCase() + personName.slice(1);

            let dateVal = document.getElementById('dateInput').value;
            if (!dateVal) {
                dateVal = new Date().toISOString().split('T')[0];
            }

            const typeVal = document.querySelector('input[name="entryType"]:checked').value;
            const amountVal = parseFloat(document.getElementById('amountInput').value);

            if (editingId) {
                ledgerData = ledgerData.map(item => {
                    if (item.id === editingId) {
                        return { ...item, person: personName, date: dateVal, type: typeVal, amount: amountVal };
                    }
                    return item;
                });
                editingId = null;
                document.getElementById('submitBtn').textContent = 'Save Entry';
                document.getElementById('formModeBadge').textContent = 'Adding';
                document.getElementById('formModeBadge').className = 'text-xs font-normal px-2.5 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-full';
                document.getElementById('cancelEditBtn').classList.add('hidden');
            } else {
                const newEntry = {
                    id: Date.now().toString(),
                    person: personName,
                    date: dateVal,
                    type: typeVal,
                    amount: amountVal
                };
                ledgerData.push(newEntry);
            }

            saveAndRefresh();
            lockPerson(personName);
            document.getElementById('amountInput').value = '';
            setDefaultDate();
        }

        function lockPerson(name) {
            lockedPerson = name;
            const personInput = document.getElementById('personInput');
            const changeContainer = document.getElementById('changePersonContainer');
            const displaySpan = document.getElementById('selectedPersonDisplay');

            personInput.value = name;
            personInput.disabled = true;
            personInput.classList.add('bg-slate-100', 'dark:bg-slate-800', 'cursor-not-allowed');
            displaySpan.textContent = `Active Person: ${name}`;
            changeContainer.classList.remove('hidden');
            document.getElementById('ghostSuggestion').textContent = '';
        }

        function unlockPerson() {
            lockedPerson = null; 
            const personInput = document.getElementById('personInput');
            const changeContainer = document.getElementById('changePersonContainer');

            personInput.value = '';
            personInput.disabled = false;
            personInput.classList.remove('bg-slate-100', 'dark:bg-slate-800', 'cursor-not-allowed');
            changeContainer.classList.add('hidden');
            document.getElementById('ghostSuggestion').textContent = '';
            personInput.focus();
        }

        function saveAndRefresh() {
            localStorage.setItem('nexora_ledger_entries', JSON.stringify(ledgerData));
            renderApp();
        }

        function filterPerson(personName) {
            currentFilterPerson = personName;
            if (personName) {
                lockPerson(personName);
            }
            renderApp();
        }

        // Reset to Home / Clear person selection
        function resetToHome() {
            currentFilterPerson = null;
            unlockPerson();
            document.getElementById('searchInput').value = '';
            renderApp();
        }

        function editEntry(id) {
            const item = ledgerData.find(i => i.id === id);
            if (!item) return;

            editingId = id;
            unlockPerson(); 
            document.getElementById('personInput').value = item.person;
            document.getElementById('dateInput').value = item.date;
            document.querySelector(`input[name="entryType"][value="${item.type}"]`).checked = true;
            document.getElementById('amountInput').value = item.amount;

            document.getElementById('submitBtn').textContent = 'Update Entry';
            document.getElementById('formModeBadge').textContent = 'Editing';
            document.getElementById('formModeBadge').className = 'text-xs font-normal px-2.5 py-1 bg-amber-100 dark:bg-amber-950 text-amber-700 dark:text-amber-300 rounded-full';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteEntry(id) {
            if (confirm('Are you sure you want to delete this transaction?')) {
                ledgerData = ledgerData.filter(i => i.id !== id);
                saveAndRefresh();
            }
        }

        function resetForm() {
            editingId = null;
            document.getElementById('ledgerForm').reset();
            document.getElementById('submitBtn').textContent = 'Save Entry';
            document.getElementById('formModeBadge').textContent = 'Adding';
            document.getElementById('formModeBadge').className = 'text-xs font-normal px-2.5 py-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-full';
            document.getElementById('cancelEditBtn').classList.add('hidden');
            unlockPerson();
            setDefaultDate();
        }

        function renderApp() {
            const tbody = document.getElementById('transactionsTableBody');
            const personsListContainer = document.getElementById('personsListContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const showAllBtn = document.getElementById('showAllBtn');
            const titleEl = document.getElementById('activeLedgerTitle');
            const subtitleEl = document.getElementById('activeLedgerSubtitle');

            const uniquePersons = getUniquePersons();
            if (uniquePersons.length === 0) {
                personsListContainer.innerHTML = `<p class="text-xs text-slate-400 py-2">No persons added yet.</p>`;
            } else {
                personsListContainer.innerHTML = uniquePersons.map(p => {
                    const isSelected = currentFilterPerson === p;
                    
                    const personEntries = ledgerData.filter(i => i.person.toLowerCase() === p.toLowerCase());
                    const pGiven = personEntries.filter(i => i.type === 'given').reduce((sum, i) => sum + Number(i.amount), 0);
                    const pTaken = personEntries.filter(i => i.type === 'taken').reduce((sum, i) => sum + Number(i.amount), 0);
                    const pNet = pGiven - pTaken; 

                    const amountColorClass = pNet >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400';
                    const activeAmountColorClass = isSelected ? 'text-white' : amountColorClass;

                    return `
                        <button type="button" onclick="filterPerson('${p}')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium flex justify-between items-center transition ${isSelected ? 'rgb-btn text-white shadow-sm' : 'bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300'}">
                            <span class="font-semibold">${p}</span>
                            <span class="font-bold text-sm ${activeAmountColorClass}">
                                ₹${Math.abs(pNet).toLocaleString('en-IN', {minimumFractionDigits: 2})}
                            </span>
                        </button>
                    `;
                }).join('');
            }

            let filtered = ledgerData;
            if (currentFilterPerson) {
                filtered = filtered.filter(i => i.person.toLowerCase() === currentFilterPerson.toLowerCase());
                titleEl.textContent = `Ledger: ${currentFilterPerson}`;
                subtitleEl.textContent = `Showing transactions for ${currentFilterPerson}`;
                showAllBtn.classList.remove('hidden');
            } else {
                titleEl.textContent = `All Transactions`;
                subtitleEl.textContent = `Showing complete transaction history`;
                showAllBtn.classList.add('hidden');
            }

            if (searchVal) {
                filtered = filtered.filter(i => 
                    i.person.toLowerCase().includes(searchVal) || 
                    i.date.includes(searchVal)
                );
            }

            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-8 text-slate-400 text-sm">No transactions found.</td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = filtered.map(item => {
                    const isGiven = item.type === 'given';
                    return `
                        <tr class="hover:bg-slate-50/60 dark:hover:bg-slate-800/50 transition">
                            <td class="py-3 px-4 text-xs font-medium text-slate-600 dark:text-slate-400">${item.date}</td>
                            <td class="py-3 px-4 text-xs font-semibold text-slate-900 dark:text-slate-200 cursor-pointer hover:text-indigo-600" onclick="filterPerson('${item.person}')">${item.person}</td>
                            <td class="py-3 px-4 text-xs">
                                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide ${isGiven ? 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-900' : 'bg-rose-50 dark:bg-rose-950/50 text-rose-700 dark:text-rose-400 border border-rose-200 dark:border-rose-900'}">
                                    ${isGiven ? 'Given' : 'Taken'}
                                </span>
                            </td>
                            <td class="py-3 px-4 text-xs font-bold text-right ${isGiven ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">
                                ₹${Number(item.amount).toLocaleString('en-IN', {minimumFractionDigits: 2})}
                            </td>
                            <td class="py-3 px-4 text-center">
                                <div class="flex items-center justify-center gap-1.5">
                                    <button type="button" onclick="editEntry('${item.id}')" title="Edit" class="p-1.5 rgb-btn text-white rounded-lg transition shadow-sm">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                    </button>
                                    <button type="button" onclick="deleteEntry('${item.id}')" title="Delete" class="p-1.5 bg-rose-500 hover:bg-rose-600 text-white rounded-lg transition shadow-sm">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            let scopeData = currentFilterPerson 
                ? ledgerData.filter(i => i.person.toLowerCase() === currentFilterPerson.toLowerCase())
                : ledgerData;

            let totalGivenAmt = scopeData.filter(i => i.type === 'given').reduce((sum, i) => sum + Number(i.amount), 0);
            let totalTakenAmt = scopeData.filter(i => i.type === 'taken').reduce((sum, i) => sum + Number(i.amount), 0);
            let netBalanceAmt = totalGivenAmt - totalTakenAmt;

            document.getElementById('totalGiven').textContent = `₹${totalGivenAmt.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
            document.getElementById('totalTaken').textContent = `₹${totalTakenAmt.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
            
            const netBalanceEl = document.getElementById('netBalance');
            netBalanceEl.textContent = `₹${Math.abs(netBalanceAmt).toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
            netBalanceEl.className = `text-2xl font-bold mt-1 ${netBalanceAmt >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`;
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(ledgerData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `nexora_ledger_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = function(e) {
                    try {
                        const parsedData = JSON.parse(e.target.result);
                        if (Array.isArray(parsedData)) {
                            ledgerData = parsedData;
                            saveAndRefresh();
                            alert('Ledger data imported successfully!');
                        } else {
                            alert('Invalid JSON file format.');
                        }
                    } catch (error) {
                        alert('Error parsing JSON file.');
                    }
                    event.target.value = '';
                }
            }
        }
    </script>
</body>
</html>
